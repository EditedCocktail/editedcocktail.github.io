<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Runtimely — page not found</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/icon.png" type="image/png">
  <link rel="stylesheet" href="assets/kit.css">
  <link rel="stylesheet" href="assets/site.css">
  <script>
    (() => {
      try {
        const theme = localStorage.getItem('runtimely-site-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {
        // Storage is a convenience, not a condition for the page to paint.
      }
    })();
  </script>
</head>
<body>
  <main class="notfound">
    <span class="notfound-code">404</span>
    <p>This page does not exist. · Такой страницы нет.</p>
    <a class="btn btn-accent" href="./">Back to Runtimely · На главную</a>
  </main>
</body>
</html>
